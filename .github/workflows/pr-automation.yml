name: Pull Request Automation & Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  path-based-labeler:
    name: Path-Based Labeler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Apply Path Labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

  smart-automation:
    name: Metadata, Size & Policy Automation
    runs-on: ubuntu-latest
    steps:
      - name: Run Intelligent PR Triage
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.MAINTAINER_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const title = pr.title;
            const action = context.payload.action;

            // Handle PR closed event
            if (action === 'closed') {
              if (pr.merged && author !== 'noruzzamans') {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number
                });

                const alreadyCommented = comments.some(c => c.body && c.body.includes(`@${author}`) && c.body.includes(`merged into \`main\``));
                if (!alreadyCommented) {
                  // Live check: has the contributor already starred this repository?
                  let hasStarred = false;
                  try {
                    const stargazers = await github.paginate(github.rest.activity.listStargazersForRepo, {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      per_page: 100
                    });
                    hasStarred = stargazers.some(s => s && s.login && s.login.toLowerCase() === author.toLowerCase());
                  } catch (err) {
                    console.log(`Could not check repository stargazers: ${err.message}`);
                  }

                  if (!hasStarred) {
                    try {
                      const starred = await github.rest.activity.listReposStarredByUser({
                        username: author,
                        per_page: 100
                      });
                      hasStarred = starred.data.some(r => r && r.full_name && r.full_name.toLowerCase() === `${context.repo.owner}/${context.repo.repo}`.toLowerCase());
                    } catch (err) {
                      // Fallback / ignore
                    }
                  }

                  // 2. Check if this is their first contribution or if they were already an existing contributor
                  let isFirstContribution = true;
                  try {
                    const { data: fileData } = await github.rest.repos.getContent({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      path: '.all-contributorsrc',
                      ref: 'main'
                    });
                    const rawContent = Buffer.from(fileData.content, 'base64').toString('utf8');
                    const allContribs = JSON.parse(rawContent);
                    if (allContribs.contributors && allContribs.contributors.some(c => c.login && c.login.toLowerCase() === author.toLowerCase())) {
                      isFirstContribution = false;
                    }
                  } catch (err) {
                    console.log(`Could not check .all-contributorsrc: ${err.message}`);
                  }

                  const contributorsCreditText = isFirstContribution 
                    ? " You have also been added to our [Contributors List](https://github.com/noruzzamans/gslider-blocks#contributors)!" 
                    : "";

                  if (!hasStarred) {
                    // Contributor has NOT starred yet: thank on merge and invite star
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      body: `Thank you for your ${isFirstContribution ? 'contribution' : 'continued contribution'}, @${author}! Your changes are now merged into \`main\`.${contributorsCreditText}\n\nIf you find GSlider Blocks valuable, a [star on GitHub](https://github.com/noruzzamans/gslider-blocks) helps us reach more developers. We also have open [good first issue](https://github.com/noruzzamans/gslider-blocks/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22) and [help wanted](https://github.com/noruzzamans/gslider-blocks/issues?q=is%3Aissue+is%3Aopen+label%3A%22help+wanted%22) issues if you would like to take on another challenge!\n\nBy the way, if you share your open-source journey on [LinkedIn](https://linkedin.com/in/noruzzaman) or [X](https://x.com/Noruzzamanwp), feel free to tag me — I would be glad to repost and celebrate your achievement!`
                    });
                  } else {
                    // Contributor ALREADY starred: thank on merge with warm gratitude, zero star nagging
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      body: `Thank you for your fantastic contribution, @${author}! Your changes are now merged into \`main\`.${contributorsCreditText}\n\nYour continued support means a lot to our community. Whenever you are ready for your next challenge, feel free to explore our open [good first issue](https://github.com/noruzzamans/gslider-blocks/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22) and [help wanted](https://github.com/noruzzamans/gslider-blocks/issues?q=is%3Aissue+is%3Aopen+label%3A%22help+wanted%22) issues!\n\nAlso, if you share your open-source journey on [LinkedIn](https://linkedin.com/in/noruzzaman) or [X](https://x.com/Noruzzamanwp), feel free to tag me — I would love to repost and celebrate your achievement!`
                    });
                  }
                }
              }
              return;
            }

            const labelsToAdd = new Set();
            const labelsToRemove = new Set();

            // 1. Auto-assign PR author on open
            if ((action === 'opened' || action === 'reopened') && (!pr.assignees || pr.assignees.length === 0)) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  assignees: [author]
                });
                console.log(`Auto-assigned author @${author} to PR #${pr.number}`);
              } catch (err) {
                console.log(`Failed to auto-assign PR author @${author}: ${err.message}`);
              }
            }

            // 2. External community contributor detection
            if (author !== 'noruzzamans') {
              labelsToAdd.add('type: community contribution');
            }

            // 3. PR Conventional Commits title parser
            if (/^fix(\(.*\))?:/i.test(title)) labelsToAdd.add('type: bug');
            if (/^feat(\(.*\))?:/i.test(title)) labelsToAdd.add('type: enhancement');
            if (/^refactor(\(.*\))?:/i.test(title)) labelsToAdd.add('type: architecture');
            if (/^perf(\(.*\))?:/i.test(title)) labelsToAdd.add('type: performance');
            if (/^sec(urity)?(\(.*\))?:/i.test(title)) labelsToAdd.add('type: security');
            if (/^docs(\(.*\))?:/i.test(title)) labelsToAdd.add('type: documentation');
            if (/^(ci|test|chore)(\(.*\))?:/i.test(title)) labelsToAdd.add('focus: ci-cd');

            // 4. Initial review status on PR open
            if (action === 'opened' || action === 'reopened') {
              labelsToAdd.add('needs: review');
            }

            // 5. PR Size Labeling (lines added + deleted)
            const totalChanges = (pr.additions || 0) + (pr.deletions || 0);
            let targetSizeLabel = 'size: S';
            if (totalChanges < 10) targetSizeLabel = 'size: XS';
            else if (totalChanges < 50) targetSizeLabel = 'size: S';
            else if (totalChanges < 250) targetSizeLabel = 'size: M';
            else if (totalChanges < 1000) targetSizeLabel = 'size: L';
            else targetSizeLabel = 'size: XL';

            const allSizeLabels = ['size: XS', 'size: S', 'size: M', 'size: L', 'size: XL'];
            const currentLabels = pr.labels.map(l => l.name);

            for (const s of allSizeLabels) {
              if (s !== targetSizeLabel && currentLabels.includes(s)) {
                labelsToRemove.add(s);
              }
            }
            labelsToAdd.add(targetSizeLabel);

            // 6. Protected Directory Guard for src/components/
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const touchedProtectedDir = files.some(f => f.filename.startsWith('src/components/'));
            if (touchedProtectedDir && author !== 'noruzzamans') {
              labelsToAdd.add('needs: changes');
              
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });
              
              const alreadyWarned = comments.some(c => c.body && c.body.includes('PROTECTED CORE DIRECTORY: `src/components/`'));
              if (!alreadyWarned) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `> [!CAUTION]\n> ### 🔒 PROTECTED CORE DIRECTORY: \`src/components/\`\n>\n> Hello @${author}! Thank you for your contribution.\n> Please note that **\`src/components/\` is maintained exclusively by @noruzzamans** to protect 2,000+ live sites.\n> External pull requests that modify files in this directory cannot be accepted without prior maintainer authorization.\n>\n> Please revert your changes to \`src/components/\` to proceed with code review.`
                });
              }
            }

            // Apply label additions
            const finalAdditions = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));
            if (finalAdditions.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: finalAdditions
              });
            }

            // Apply label removals
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch (err) {
                // Ignore if already removed
              }
            }

            // 7. Contributor Props Bot (Gutenberg-style Co-authored-by Attribution)
            if (action !== 'closed' && author !== 'noruzzamans' && author !== 'dependabot[bot]') {
              const PROPS_IDENTIFIER = '<!-- PROPS-BOT-MANAGED-COMMENT -->';
              try {
                const commits = await github.paginate(github.rest.pulls.listCommits, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100
                });

                const contributors = new Map();

                contributors.set(author.toLowerCase(), {
                  name: pr.user?.name || author,
                  login: author,
                  email: `${author}@users.noreply.github.com`
                });

                for (const c of commits) {
                  const committerLogin = c.author?.login;
                  const committerName = c.commit?.author?.name || committerLogin;
                  const committerEmail = c.commit?.author?.email || (committerLogin ? `${committerLogin}@users.noreply.github.com` : null);

                  if (committerLogin && committerLogin !== 'noruzzamans' && committerLogin !== 'github-actions[bot]') {
                    contributors.set(committerLogin.toLowerCase(), {
                      name: committerName,
                      login: committerLogin,
                      email: committerEmail
                    });
                  }
                }

                const coAuthoredLines = Array.from(contributors.values())
                  .map(c => `Co-authored-by: ${c.name} <${c.email}>`)
                  .join('\n');

                const propsCommentBody = `${PROPS_IDENTIFIER}\n### 🎉 Props\n\nIf you're merging code through this pull request on GitHub, copy and paste the following into the bottom of the merge commit message:\n\n\`\`\`text\n${coAuthoredLines}\n\`\`\``;

                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100
                });

                const existingPropsComment = comments.find(c => c.body && c.body.includes(PROPS_IDENTIFIER));

                if (existingPropsComment) {
                  if (existingPropsComment.body.trim() !== propsCommentBody.trim()) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existingPropsComment.id,
                      body: propsCommentBody
                    });
                    console.log(`Updated Props comment for PR #${pr.number}`);
                  }
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: propsCommentBody
                  });
                  console.log(`Created new Props comment for PR #${pr.number}`);
                }
              } catch (err) {
                console.log(`Props Bot encountered an error: ${err.message}`);
              }
            }

  auto-contributor:
    name: Auto Add All-Contributor
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.user.login != 'noruzzamans' && github.event.pull_request.user.login != 'app/dependabot'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MAINTAINER_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Add Contributor to All-Contributors
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "Processing contributor @${AUTHOR}..."
          npx --yes all-contributors-cli add "${AUTHOR}" code
          npx --yes all-contributors-cli generate

      - name: Commit and Push if Changed
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain README.md .all-contributorsrc) ]]; then
            git add README.md .all-contributorsrc
            git commit -m "docs(contributors): add @${AUTHOR} to all-contributors [skip ci]"
            git push origin main
          else
            echo "No changes in contributors list (already present)."
          fi
